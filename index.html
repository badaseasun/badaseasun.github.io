    <!-- Mobile App Native Bridge & Hardware Integration API (Android WebView / iOS WKWebView / React Native / Web) -->
    <script>
      (function() {
        window.DajabaBridge = {
          isNative: !!(
            window.AndroidBridge ||
            (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.DajabaBridge) ||
            window.ReactNativeWebView
          ),
          platform: (function() {
            if (window.AndroidBridge) return 'android';
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.DajabaBridge) return 'ios';
            if (window.ReactNativeWebView) return 'react-native';
            return 'web';
          })(),

          // Post messages to host native application
          postMessage: function(action, payload) {
            var msg = JSON.stringify({ action: action, payload: payload, timestamp: Date.now() });
            console.log('[DajabaBridge >> Native]', action, payload);

            try {
              if (window.AndroidBridge && typeof window.AndroidBridge.postMessage === 'function') {
                window.AndroidBridge.postMessage(msg);
              } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.DajabaBridge) {
                window.webkit.messageHandlers.DajabaBridge.postMessage(msg);
              } else if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
                window.ReactNativeWebView.postMessage(msg);
              } else {
                window.dispatchEvent(new CustomEvent('dajaba-native-bridge-event', { detail: { action: action, payload: payload } }));
              }
            } catch (err) {
              console.warn('Bridge postMessage error:', err);
            }
          },

          // Hardware Haptic / Vibration
          vibrate: function(ms) {
            var duration = ms || 80;
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
              try { navigator.vibrate(duration); } catch(e) {}
            }
            this.postMessage('vibrate', { duration: duration });
          },

          // Web Audio API Synthesizer (Instant haptic audio without external assets)
          playSound: function(type) {
            try {
              var AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              var ctx = new AudioCtx();
              var soundType = type || 'click';

              if (soundType === 'click') {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.06);
              } else if (soundType === 'fanfare') {
                var tones = [523.25, 659.25, 783.99, 1046.50];
                tones.forEach(function(freq, idx) {
                  var subOsc = ctx.createOscillator();
                  var subGain = ctx.createGain();
                  subOsc.connect(subGain);
                  subGain.connect(ctx.destination);
                  subOsc.type = 'triangle';
                  subOsc.frequency.value = freq;
                  var start = ctx.currentTime + idx * 0.11;
                  subGain.gain.setValueAtTime(0.28, start);
                  subGain.gain.exponentialRampToValueAtTime(0.01, start + 0.32);
                  subOsc.start(start);
                  subOsc.stop(start + 0.32);
                });
              }
            } catch (e) {
              console.warn('AudioContext sound not supported or gesture needed:', e);
            }
          },

          // Geolocation GPS
          getCurrentLocation: function(callback, errorCallback) {
            if (typeof navigator !== 'undefined' && navigator.geolocation) {
              var self = this;
              navigator.geolocation.getCurrentPosition(
                function(pos) {
                  var coords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                  self.postMessage('location_updated', coords);
                  if (callback) callback(coords);
                },
                function(err) {
                  if (errorCallback) errorCallback(err);
                },
                { enableHighAccuracy: true, timeout: 6000 }
              );
            } else if (errorCallback) {
              errorCallback(new Error('Geolocation not available'));
            }
          },

          // Universal Deep Link Navigation (KakaoMap / Naver / Tmap / KakaoT / Google)
          openMap: function(type, placeName, addr, lat, lng) {
            this.vibrate(50);
            var encName = encodeURIComponent(placeName || '');
            var encAddr = encodeURIComponent(addr || '');
            var query = encodeURIComponent((placeName + ' ' + (addr || '')).trim());

            var appUrl = '';
            var webUrl = '';

            if (type === 'kakao') {
              appUrl = (lat && lng) ? 'kakaomap://look?p=' + lat + ',' + lng : 'kakaomap://search?q=' + encName;
              webUrl = 'https://map.kakao.com/link/search/' + (encName || encAddr);
            } else if (type === 'naver') {
              appUrl = (lat && lng)
                ? 'nmap://place?lat=' + lat + '&lng=' + lng + '&name=' + encName + '&appname=com.dajabatrip.app'
                : 'nmap://search?query=' + encName + '&appname=com.dajabatrip.app';
              webUrl = 'https://map.naver.com/v5/search/' + (encName || encAddr);
            } else if (type === 'tmap') {
              appUrl = (lat && lng)
                ? 'tmap://route?goalname=' + encName + '&goalx=' + lng + '&goaly=' + lat
                : 'tmap://search?name=' + encName;
              webUrl = 'https://tmap.co.kr/';
            } else if (type === 'taxi') {
              appUrl = (lat && lng)
                ? 'kakaot://taxi?dest_lat=' + lat + '&dest_lng=' + lng
                : 'kakaot://';
              webUrl = 'https://www.kakaomobility.com/';
            } else {
              webUrl = 'https://www.google.com/maps/search/?api=1&query=' + query;
            }

            this.postMessage('map_opened', { type: type, placeName: placeName, addr: addr, lat: lat, lng: lng });

            if (appUrl) {
              var start = Date.now();
              window.location.href = appUrl;
              setTimeout(function() {
                if (Date.now() - start < 1500 && webUrl) {
                  window.open(webUrl, '_blank');
                }
              }, 800);
            } else if (webUrl) {
              window.open(webUrl, '_blank');
            }
          },

          // Native / Web Share
          share: function(title, text, url) {
            this.postMessage('share', { title: title, text: text, url: url });
            if (typeof navigator !== 'undefined' && navigator.share) {
              return navigator.share({ title: title, text: text, url: url || window.location.href });
            }
            return Promise.reject(new Error('navigator.share not supported'));
          }
        };

        // Listen for incoming messages from Host App (Android / iOS / React Native)
        window.addEventListener('message', function(event) {
          try {
            var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            if (data && data.action) {
              console.log('[Native >> DajabaBridge]', data.action, data.payload);
              window.dispatchEvent(new CustomEvent('dajaba-native-incoming', { detail: data }));
            }
          } catch(e) {}
        });
      })();
    </script>
